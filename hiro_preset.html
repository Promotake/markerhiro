<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>ЛР4 — робот на квадратном AR-маркере</title>
  <style>
    /* AR.js modifies body width and margins in portrait mode to create a 4:3 stage.
       Prevent those inline changes from shifting the page and revealing a white strip. */
    html, body {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      padding: 0 !important;
      margin: 0 !important;
      margin-left: 0 !important;
      margin-top: 0 !important;
      overflow: hidden !important;
      background: #000 !important;
    }

    /* Let AR.js determine the real video element dimensions and crop offsets.
       We must NOT overwrite its width/height or margins with object-fit: cover,
       otherwise video framing and AR projection stop matching. */
    #arjs-video {
      position: fixed !important;
      left: 0 !important;
      top: 0 !important;
      display: block !important;
      z-index: 0 !important;
      max-width: none !important;
      max-height: none !important;
      opacity: 1 !important;
      visibility: visible !important;
      object-fit: fill !important;
    }

    /* Render the 3D scene at EXACTLY the video stage size and offset.
       The viewport crops both identically, so the robot stays on the marker. */
    a-scene#arScene {
      display: block !important;
      position: fixed !important;
      top: var(--track-top, 0px) !important;
      left: var(--track-left, 0px) !important;
      width: var(--track-width, 100vw) !important;
      height: var(--track-height, 100dvh) !important;
      padding: 0 !important;
      margin: 0 !important;
      z-index: 1 !important;
      overflow: visible !important;
      background: transparent !important;
      pointer-events: none !important;
    }
    a-scene#arScene canvas.a-canvas {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
    }
  </style>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
  <script>
    (function () {
      'use strict';
      function startLayoutSync() {
        var scene = document.getElementById('arScene');
        if (!scene) return;
        var last = '';

        function ensureTransparentRenderer() {
          if (!scene.renderer) return;
          // Without this, an opaque WebGL clear can hide the real camera.
          scene.renderer.setClearColor(0x000000, 0);
          scene.renderer.setClearAlpha(0);
          if (scene.object3D) scene.object3D.background = null;
        }

        function syncLayers() {
          ensureTransparentRenderer();
          var video = document.getElementById('arjs-video');
          if (!video || !video.videoWidth || !video.videoHeight) return;

          // AR.js computes the camera's cover-crop in these exact CSS properties.
          var width  = parseFloat(video.style.width);
          var height = parseFloat(video.style.height);
          var left   = parseFloat(video.style.marginLeft) || 0;
          var top    = parseFloat(video.style.marginTop) || 0;
          if (!Number.isFinite(width) || !Number.isFinite(height) || width < 1 || height < 1) return;

          var key = [width.toFixed(2), height.toFixed(2), left.toFixed(2), top.toFixed(2)].join(',');
          if (key === last) return;
          last = key;

          scene.style.setProperty('--track-width', width + 'px');
          scene.style.setProperty('--track-height', height + 'px');
          scene.style.setProperty('--track-left', left + 'px');
          scene.style.setProperty('--track-top', top + 'px');

          // A-Frame needs a viewport update as its stage dimension changes.
          if (scene.is('loaded') && typeof scene.resize === 'function') {
            scene.resize();
          } else if (scene.renderer) {
            scene.renderer.setSize(Math.round(width), Math.round(height), false);
          }
        }

        // AR.js occasionally recalculates camera crop, especially after Safari
        // toolbar changes or rotating the device. Keep the stage synchronized.
        window.addEventListener('resize', function () {
          requestAnimationFrame(function () { requestAnimationFrame(syncLayers); });
        });
        window.addEventListener('arjs-video-loaded', function () {
          requestAnimationFrame(syncLayers);
        });
        scene.addEventListener('renderstart', syncLayers);
        scene.addEventListener('loaded', ensureTransparentRenderer);
        window.setInterval(syncLayers, 180);
        syncLayers();
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startLayoutSync);
      else startLayoutSync();
    }());
  </script>
</head>
<body>
  <a-scene id="arScene"
    embedded
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="alpha: true; antialias: true; precision: medium;"
    arjs="sourceType: webcam; videoTexture: false; trackingMethod: best; debugUIEnabled: false; patternRatio: 0.5;">

    <a-assets timeout="30000">
      <a-asset-item id="robotModel" src="./assets/models/astrabot.glb"></a-asset-item>
    </a-assets>

    <a-marker type="pattern" url="./marker/square_marker.patt"
      smooth="true" smooth-count="8" smooth-tolerance="0.01" smooth-threshold="2">
      <!-- Place the model's geometric horizontal center over marker origin.
           Stop continuous rotation; it creates apparent off-center movement. -->
      <a-entity id="robot" gltf-model="#robotModel"
        position="-0.0200 0.0076 0.0306"
        rotation="0 0 0"
        scale="0.85 0.85 0.85">
      </a-entity>
      <a-light type="ambient" intensity="1.35"></a-light>
      <a-light type="directional" intensity="1.25" position="1 2 1"></a-light>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
