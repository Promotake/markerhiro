<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>LR4 - AR robot on square marker</title>

  <style>
    /* Force a true AR overlay: live video underneath transparent WebGL. */
    html, body {
      position: fixed; inset: 0; margin: 0; padding: 0;
      width: 100%; height: 100%; overflow: hidden;
      background: transparent !important;
    }
    /* AR.js inserts its own camera stream as #arjs-video. */
    #arjs-video, video#arjs-video {
      display: block !important;
      position: fixed !important;
      left: 0 !important; top: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      min-width: 100vw !important;
      min-height: 100vh !important;
      object-fit: cover !important;
      max-width: none !important;
      max-height: none !important;
      opacity: 1 !important;
      visibility: visible !important;
      z-index: 0 !important;
    }
    a-scene, a-scene[embedded] {
      position: fixed !important; inset: 0 !important;
      display: block !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      z-index: 1 !important;
      background: transparent !important;
      overflow: hidden;
    }
    a-scene canvas, .a-canvas {
      display: block !important;
      background: transparent !important;
    }
  </style>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

  <script>
    /* Never create a second camera stream. Expose the one already used by AR.js. */
    function keepCameraBehindModel() {
      var scene = document.getElementById('arScene');
      if (scene && scene.renderer) {
        scene.renderer.setClearColor(0x000000, 0);
        scene.renderer.setClearAlpha(0);
      }
      if (scene && scene.object3D) scene.object3D.background = null;
      var cameraVideo = document.querySelector('#arjs-video');
      if (cameraVideo) {
        cameraVideo.setAttribute('playsinline', '');
        cameraVideo.setAttribute('webkit-playsinline', '');
        cameraVideo.muted = true;
        cameraVideo.style.setProperty('z-index', '0', 'important');
      }
    }
    document.addEventListener('DOMContentLoaded', function () {
      var scene = document.getElementById('arScene');
      if (scene) scene.addEventListener('renderstart', keepCameraBehindModel);
      for (var target of [document, window]) {
        target.addEventListener('arjs-video-loaded', keepCameraBehindModel);
        target.addEventListener('camera-init', keepCameraBehindModel);
        target.addEventListener('resize', keepCameraBehindModel);
      }
      var watcher = new MutationObserver(function () {
        if (document.getElementById('arjs-video')) {
          keepCameraBehindModel();
          watcher.disconnect();
        }
      });
      watcher.observe(document.body, { childList: true, subtree: true });
      keepCameraBehindModel();
    });
  </script>
</head>
<body>
  <a-scene id="arScene"
    embedded
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="antialias: true; alpha: true; precision: medium"
    arjs="sourceType: webcam; videoTexture: false; trackingMethod: best; debugUIEnabled: false; patternRatio: 0.5;">

    <a-assets timeout="30000">
      <a-asset-item id="robotModel" src="./assets/models/astrabot.glb"></a-asset-item>
    </a-assets>

    <!-- This is the custom SQUARE, not the old HIRO preset. -->
    <a-marker id="squareMarker" type="pattern" url="./marker/square_marker.patt"
              emitevents="true" smooth="true" smooth-count="8"
              smooth-tolerance="0.01" smooth-threshold="2">
      <a-entity id="robot" gltf-model="#robotModel"
                position="0 0.03 0" rotation="0 0 0" scale="0.55 0.55 0.55"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear">
      </a-entity>
      <a-light type="ambient" intensity="1.35"></a-light>
      <a-light type="directional" intensity="1.25" position="1 2 1"></a-light>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
